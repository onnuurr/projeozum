; patternengine-service — Çocuk giyim kalıp motoru (FastAPI/uvicorn, pattern-core).
; Yalnızca localhost'a bakar; Laravel'in Modules/PatternEngine/Services/Drivers/
; HttpPatternEngineClient'ı buraya http://127.0.0.1:8201 üzerinden bağlanır
; (bkz. Modules/PatternEngine/config/config.php engine.service_url, PATTERN_ENGINE_URL).
; Atelier'in atelier-pdf-dxf servisi 8200'de çalıştığı için bu servis 8201 kullanır.
;
; Kurulum:
;   sudo cp Modules/PatternEngine/python/pattern_service/deploy/patternengine-service.conf \
;       /etc/supervisor/conf.d/patternengine-service.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status patternengine-service:*

[program:patternengine-service]
process_name=%(program_name)s_%(process_num)02d
command=/home/ozumserver/htdocs/ozumserver.com.tr/Modules/PatternEngine/python/pattern_service/.venv/bin/uvicorn api.main:app --host 127.0.0.1 --port 8201
directory=/home/ozumserver/htdocs/ozumserver.com.tr/Modules/PatternEngine/python/pattern_service
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=ozumserver
numprocs=1
redirect_stderr=true
stdout_logfile=/home/ozumserver/htdocs/ozumserver.com.tr/Modules/PatternEngine/python/pattern_service/logs/service.out
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
startsecs=3
